<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Travel</title>

<!-- FONTS -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- GSAP -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<!-- THREE JS VERSION CLASSIQUE (FIX MOBILE) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: black;
  color: white;
  overflow-x: hidden;
}

/* LOADER */
#loader {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
  font-size: 24px;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

h1 {
  font-size: 3rem;
  opacity: 0;
}

/* CANVAS 3D */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
}

/* SECTION */
.section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
</style>
</head>

<body>

<div id="loader">Loading...</div>

<div class="hero">
  <h1 id="title">Luxury Travel</h1>
</div>

<div class="section">
  <h2>Explore the world</h2>
</div>

<script>
let scene, camera, renderer, model;

function hideLoader() {
  const loader = document.getElementById("loader");
  loader.style.opacity = "0";
  setTimeout(() => loader.style.display = "none", 500);
}

/* ====== THREE JS ====== */
function init3D() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(2, 2, 5);
  scene.add(light);

  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);

  const loader = new THREE.GLTFLoader();

  console.log("MODEL LOADING...");

  loader.load(
    "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Lantern/glTF-Binary/Lantern.glb",
    function (gltf) {
      model = gltf.scene;
      model.scale.set(2, 2, 2);
      scene.add(model);
      hideLoader();
    },
    undefined,
    function (error) {
      console.error("ERREUR MODEL:", error);

      // FALLBACK SI LE MODEL BUG
      const geometry = new THREE.TorusKnotGeometry(1, 0.3, 100, 16);
      const material = new THREE.MeshStandardMaterial({ color: 0xffffff });
      model = new THREE.Mesh(geometry, material);
      scene.add(model);

      hideLoader();
    }
  );
}

/* ====== ANIMATION ====== */
function animate() {
  requestAnimationFrame(animate);

  if (model) {
    model.rotation.y += 0.01;
  }

  renderer.render(scene, camera);
}

/* ====== GSAP ====== */
function initAnimations() {
  gsap.to("#title", {
    opacity: 1,
    y: -20,
    duration: 1.5
  });
}

/* ====== RESIZE ====== */
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ====== FORCE LOAD (ANTI BUG ÉCRAN NOIR) ====== */
window.addEventListener("load", () => {
  setTimeout(() => {
    hideLoader();
  }, 3000);
});

/* ====== START ====== */
init3D();
initAnimations();
animate();

</script>

</body>
</html>
